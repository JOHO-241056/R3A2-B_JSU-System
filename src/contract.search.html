<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>保守契約依頼書検索・確認画面</title>
  <meta name="description" content="保守契約依頼書検索・確認画面">
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/contract.search.css" rel="stylesheet">
</head>

<body>
  <header class="navbar navbar-expand-md mb-auto border-bottom">
    <div class="container-fluid">
      <a class="navbar-brand me-1" href="index.html">ABC社保守管理システム</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="index.html">トップ画面</a>
          <a class="nav-link" href="quotation.index.html">JSU見積機能</a>
          <a class="nav-link active" aria-current="page" href="contract.index.html">保守契約</a>
          <a class="nav-link" href="incident-management.index.html">障害対応</a>
          <span class="navbar-text">[技術部 山田太郎]</span>
        </div>
      </div>
    </div>
  </header>
  <div class="container">
    <h2 class="page-title">保守契約依頼書検索・確認画面</h2>

    <!-- 検索パネル -->
    <div class="search-panel">
      <div class="search-row mb-10">
        <label class="search-label">保守会社名:</label>
        <input type="text" placeholder="例: 株式会社ABC" class="form-input">

        <label class="search-label ml-20">依頼書ID:</label>
        <input type="text" placeholder="例: REQ-2026-001" class="form-input">
      </div>
      <div class="search-row">
        <!-- 依頼日から契約期間へ変更 -->
        <label class="search-label">契約期間:</label>
        <input type="date" class="form-input-date"> ～ <input type="date" class="form-input-date ml-10">

        <button class="btn btn-dark ml-20">検索</button>
      </div>
    </div>

    <!-- 検索結果一覧テーブル -->
    <h3 class="section-title">検索結果</h3>
    <table class="data-table">
      <thead>
        <tr>
          <th>依頼書ID</th>
          <th>保守会社名</th>
          <!-- テーブルの項目も契約期間に変更 -->
          <th>契約期間</th>
          <th>見積金額(円)</th>
          <th class="col-action">操作</th>
        </tr>
      </thead>
      <tbody>
        <!-- 1行目 -->
        <tr>
          <td>REQ-2026-001</td>
          <td>株式会社ABC</td>
          <td>2026/10/01 ～ 2027/09/30</td>
          <td class="text-right">300,000</td>
          <td class="text-center">
            <button class="btn btn-outline btn-small">依頼書詳細を確認</button>
          </td>
        </tr>
        <!-- 2行目 -->
        <tr>
          <td>REQ-2026-002</td>
          <td>XYZネット</td>
          <td>2026/11/01 ～ 2028/10/31</td>
          <td class="text-right">150,000</td>
          <td class="text-center">
            <button class="btn btn-outline btn-small">依頼書詳細を確認</button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- アクションボタンエリア -->
    <div class="action-area">
      <button onclick="alert('ホーム画面へ遷移します。');" class="btn btn-default">
        &laquo; ホーム画面へ戻る
      </button>
    </div>
  </div>
  <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
