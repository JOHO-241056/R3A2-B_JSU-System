<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>編集ページ</title>
  <meta name="description" content="技術部専用">
  <!-- ここにCSSファイルのパスを指定してください（例: style.css） -->
  <link rel="stylesheet" href="hosyukeiyaku.css">
</head>
<body>
  <div class="container">
    <h2 class="page-title">保守契約明細確認・編集画面（技術部）</h2>
    <p>確認する保守契約明細IDを選択、または製品IDを検索して、除外する製品にチェックを入れてください。</p>

    <!-- 検索・絞り込みパネル -->
    <div class="search-panel">
      <div class="search-row">
        <label class="search-label">保守契約明細ID: </label>
        <select class="select-id">
          <option>すべて表示</option>
          <option selected>MEISAI-202607-001</option>
          <option>MEISAI-202607-002</option>
        </select>
      </div>
      <div>
        <label class="search-label">製品ID検索: </label>
        <input type="text" placeholder="例: PRD-001" class="input-keyword">
        <button class="btn-search">検索・表示</button>
      </div>
    </div>

    <!-- 明細テーブル（選択・検索結果） -->
    <table class="detail-table">
      <thead>
        <tr>
          <th class="col-exclude">除外</th>
          <th class="col-reason">除外理由</th>
          <th>製品ID</th>
          <th>製品名</th>
          <th>保守会社</th>
          <th>契約満了日</th>
          <th>見積金額(円)</th>
        </tr>
      </thead>
      <tbody>
        <!-- 1行目 -->
        <tr>
          <td class="cell-center"><input type="checkbox"></td>
          <td>
            <select class="select-reason" onchange="this.nextElementSibling.style.display = (this.value === 'その他') ? 'block' : 'none';">
              <option value="">選択してください</option>
              <option value="リプレース予定">リプレース予定</option>
              <option value="廃棄予定">廃棄予定</option>
              <option value="その他">その他</option>
            </select>
            <input type="text" placeholder="理由を入力してください" class="input-reason-other">
          </td>
          <td>PRD-001</td>
          <td>メインサーバーA</td>
          <td>株式会社ABC</td>
          <td>2026/09/30</td>
          <td>100,000</td>
        </tr>
        <!-- 2行目 -->
        <tr>
          <td class="cell-center"><input type="checkbox" checked></td>
          <td>
            <select class="select-reason" onchange="this.nextElementSibling.style.display = (this.value === 'その他') ? 'block' : 'none';">
              <option value="">選択してください</option>
              <option value="リプレース予定" selected>リプレース予定</option>
              <option value="廃棄予定">廃棄予定</option>
              <option value="その他">その他</option>
            </select>
            <input type="text" placeholder="理由を入力してください" class="input-reason-other">
          </td>
          <td>PRD-045</td>
          <td>スイッチC</td>
          <td>株式会社ABC</td>
          <td>2026/09/30</td>
          <td>200,000</td>
        </tr>
      </tbody>
    </table>

    <!-- アクションボタンエリア -->
    <div class="action-area">
      <!-- 戻るボタン -->
      <button onclick="location.href='//ここに戻る先のやついれる*/'" class="btn-back">
        戻る
      </button>

      <!-- 保存・確定ボタン -->
      <div>
        <button class="btn-save">
          一時保存する
        </button>
        <button class="btn-submit">
          確定して営業部へ通知する
        </button>
      </div>
    </div>
  </div>
</body>
</html>
